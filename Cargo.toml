[package]
name = "governance-contract"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Soroban governance contract: deposits, checkpointed voting power, proposals, votes, timelock, execution."
repository = "https://github.com/Stellar-Governance/governance-contract"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "29.0.1"

[dev-dependencies]
soroban-sdk = { version = "29.0.1", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
